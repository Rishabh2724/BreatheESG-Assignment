# Render blueprint. One web service + one managed Postgres.
# The React app is built locally (npm run build -> backend/web_build) and committed, so the
# Python build step only collects static + migrates + seeds. This keeps the deploy runtime
# Python-only (no Node toolchain needed on Render).
services:
  - type: web
    name: breathe-esg
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate && python manage.py seed"
    startCommand: "gunicorn core.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: DEBUG
        value: "0"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: breathe-db
          property: connectionString

databases:
  - name: breathe-db
    plan: free
